<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Trending Pic - Prompt</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .prompt-detail {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .detail-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            margin-bottom: 25px;
        }

        .detail-category {
            color: #a78bfa;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .detail-title {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .detail-description {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            color: #bbb;
            flex-wrap: wrap;
        }

        .prompt-box {
            background: #1a1a22;
            border: 1px solid #34343e;
            border-radius: 14px;
            padding: 20px;
            line-height: 1.7;
            color: #ddd;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .detail-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .detail-buttons button {
            flex: 1;
            padding: 13px;
            border: 1px solid #34343e;
            border-radius: 12px;
            background: #20202a;
            color: #ddd;
            font-weight: bold;
            cursor: pointer;
        }

        .detail-buttons button:hover {
            background: #2c2c38;
        }

        .detail-buttons .liked {
            color: #ff6b81;
        }

        .copy-full-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #a78bfa;
            color: #111116;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .copy-full-btn:hover {
            opacity: 0.9;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #aaa;
            text-decoration: none;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        @media (max-width: 600px) {

            .prompt-detail {
                margin: 20px auto;
                padding: 15px;
            }

            .detail-title {
                font-size: 26px;
            }

            .detail-buttons {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            AI Trending Pic
        </div>

        <button
            class="menu-btn"
            onclick="toggleMenu()"
        >
            ☰
        </button>

        <nav id="navMenu">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#trending">
                Trending
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="favorites.html">
                ❤️ Favorites
            </a>

        </nav>

    </header>


    <main class="prompt-detail">

        <a
            href="index.html"
            class="back-btn"
        >
            ← Back
        </a>


        <div
            id="loading"
            class="loading"
        >
            Loading prompt...
        </div>


        <div
            id="promptContent"
            style="display:none;"
        >

            <img
                id="detailImage"
                class="detail-image"
                src=""
                alt=""
            >


            <div
                id="detailCategory"
                class="detail-category"
            ></div>


            <h1
                id="detailTitle"
                class="detail-title"
            ></h1>


            <p
                id="detailDescription"
                class="detail-description"
            ></p>


            <div class="stats">

                <span id="detailLikes">
                    ❤️ 0 Likes
                </span>

                <span id="detailViews">
                    👁️ 0 Views
                </span>

            </div>


            <div class="detail-buttons">

                <button
                    id="detailLikeButton"
                    onclick="likeCurrentPrompt()"
                >
                    🤍 Like
                </button>


                <button
                    onclick="shareCurrentPrompt()"
                >
                    🔗 Share
                </button>

            </div>


            <h2>
                📝 AI Prompt
            </h2>


            <div
                id="detailPrompt"
                class="prompt-box"
            ></div>


            <button
                class="copy-full-btn"
                onclick="copyFullPrompt()"
            >
                📋 Copy Prompt
            </button>

        </div>


        <div
            id="notFound"
            class="loading"
            style="display:none;"
        >
            Prompt not found 😔
        </div>

    </main>


    <script type="module">

        import {
            getFirebasePrompts,
            db
        } from "./firebase.js";


        import {
            doc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // ================= MENU =================

        window.toggleMenu = function () {

            const navMenu =
                document.getElementById("navMenu");

            if (navMenu) {

                navMenu.classList.toggle("show");

            }

        };


        // ================= URL ID =================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const id =
            params.get("id");


        let currentItem = null;


        // ================= LIKES =================

        function getLikedPrompts() {

            return JSON.parse(
                localStorage.getItem(
                    "aiTrendingLikes"
                ) || "[]"
            );

        }


        function hasLiked(id) {

            return getLikedPrompts()
                .includes(String(id));

        }


        function updateLikeButton() {

            const button =
                document.getElementById(
                    "detailLikeButton"
                );


            if (!button) return;


            if (hasLiked(id)) {

                button.textContent =
                    "❤️ Liked";

                button.classList.add(
                    "liked"
                );

            } else {

                button.textContent =
                    "🤍 Like";

                button.classList.remove(
                    "liked"
                );

            }

        }


        // ================= LIKE CURRENT =================

        window.likeCurrentPrompt =
            async function () {

                if (!currentItem) return;


                if (hasLiked(currentItem.id)) {

                    showMessage(
                        "You already liked this ❤️"
                    );

                    return;

                }


                try {

                    const promptRef =
                        doc(
                            db,
                            "prompts",
                            String(currentItem.id)
                        );


                    await updateDoc(
                        promptRef,
                        {
                            likes: increment(1)
                        }
                    );


                    currentItem.likes =
                        (Number(currentItem.likes) || 0) + 1;


                    let liked =
                        getLikedPrompts();


                    liked.push(
                        String(currentItem.id)
                    );


                    localStorage.setItem(
                        "aiTrendingLikes",
                        JSON.stringify(liked)
                    );


                    document.getElementById(
                        "detailLikes"
                    ).textContent =
                        "❤️ " +
                        currentItem.likes +
                        " Likes";


                    updateLikeButton();


                    showMessage(
                        "Liked ❤️"
                    );


                } catch (error) {

                    console.error(
                        "Like error:",
                        error
                    );


                    showMessage(
                        "Like failed ❌"
                    );

                }

            };


        // ================= SHARE =================

        window.shareCurrentPrompt =
            function () {

                if (!currentItem) return;


                const url =
                    window.location.href;


                const shareData = {

                    title:
                        currentItem.title ||
                        "AI Trending Pic",

                    text:
                        "Check this AI photo prompt on AI Trending Pic!",

                    url: url

                };


                if (navigator.share) {

                    navigator.share(
                        shareData
                    ).catch(error => {

                        if (
                            error.name !==
                            "AbortError"
                        ) {

                            copyLink(url);

                        }

                    });

                } else {

                    copyLink(url);

                }

            };


        // ================= COPY SHARE LINK =================

        function copyLink(url) {

            if (navigator.clipboard) {

                navigator.clipboard
                    .writeText(url)
                    .then(() => {

                        showMessage(
                            "Link copied! 🔗"
                        );

                    })
                    .catch(() => {

                        fallbackCopy(
                            url
                        );

                    });

            } else {

                fallbackCopy(url);

            }

        }


        // ================= LOAD PROMPT =================

        async function loadPrompt() {

            try {

                const allPrompts =
                    await getFirebasePrompts();


                const item =
                    allPrompts.find(
                        prompt =>
                            String(prompt.id) ===
                            String(id)
                    );


                document.getElementById(
                    "loading"
                ).style.display = "none";


                if (!item) {

                    document.getElementById(
                        "notFound"
                    ).style.display = "block";

                    return;

                }


                currentItem = item;


                document.getElementById(
                    "promptContent"
                ).style.display = "block";


                document.getElementById(
                    "detailImage"
                ).src =
                    item.image || "";


                document.getElementById(
                    "detailImage"
                ).alt =
                    item.title ||
                    "AI Photo";


                document.getElementById(
                    "detailCategory"
                ).textContent =
                    item.category || "";


                document.getElementById(
                    "detailTitle"
                ).textContent =
                    item.title || "";


                document.getElementById(
                    "detailDescription"
                ).textContent =
                    item.description || "";


                document.getElementById(
                    "detailLikes"
                ).textContent =
                    "❤️ " +
                    (Number(item.likes) || 0) +
                    " Likes";


                document.getElementById(
                    "detailPrompt"
                ).textContent =
                    item.prompt || "";


                window.currentPrompt =
                    item.prompt || "";


                updateLikeButton();


                // ================= ADD VIEW =================

                try {

                    await updateDoc(
                        doc(
                            db,
                            "prompts",
                            String(item.id)
                        ),
                        {
                            views: increment(1)
                        }
                    );


                    item.views =
                        (Number(item.views) || 0) + 1;


                } catch (viewError) {

                    console.error(
                        "View update error:",
                        viewError
                    );

                }


                document.getElementById(
                    "detailViews"
                ).textContent =
                    "👁️ " +
                    (Number(item.views) || 0) +
                    " Views";


            } catch (error) {

                console.error(
                    "Prompt loading error:",
                    error
                );


                document.getElementById(
                    "loading"
                ).style.display = "none";


                document.getElementById(
                    "notFound"
                ).style.display = "block";

            }

        }


        // ================= COPY PROMPT =================

        window.copyFullPrompt =
            function () {

                const text =
                    window.currentPrompt || "";


                if (!text) return;


                if (navigator.clipboard) {

                    navigator.clipboard
                        .writeText(text)
                        .then(() => {

                            showMessage(
                                "Prompt copied! ✅"
                            );

                        })
                        .catch(() => {

                            fallbackCopy(text);

                        });

                } else {

                    fallbackCopy(text);

                }

            };


        // ================= FALLBACK COPY =================

        function fallbackCopy(text) {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                text;


            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    "copy"
                );

                showMessage(
                    "Copied! ✅"
                );

            } catch {

                showMessage(
                    "Copy failed ❌"
                );

            }


            document.body.removeChild(
                textarea
            );

        }


        // ================= MESSAGE =================

        function showMessage(message) {

            let box =
                document.getElementById(
                    "detailMessage"
                );


            if (!box) {

                box =
                    document.createElement(
                        "div"
                    );


                box.id =
                    "detailMessage";


                box.style.position =
                    "fixed";


                box.style.bottom =
                    "25px";


                box.style.left =
                    "50%";


                box.style.transform =
                    "translateX(-50%)";


                box.style.background =
                    "#22222a";


                box.style.color =
                    "#ffffff";


                box.style.padding =
                    "12px 20px";


                box.style.borderRadius =
                    "10px";


                box.style.zIndex =
                    "9999";


                box.style.border =
                    "1px solid #444450";


                box.style.fontSize =
                    "14px";


                document.body.appendChild(
                    box
                );

            }


            box.textContent =
                message;


            box.style.display =
                "block";


            setTimeout(() => {

                box.style.display =
                    "none";

            }, 2000);

        }


        // ================= START =================

        loadPrompt();

    </script>

</body>

</html>
